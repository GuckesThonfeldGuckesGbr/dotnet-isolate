name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: src/DotnetIsolate

jobs:
  # POR-1/POR-2/QP-9: build + test across every platform/SDK combination this tool commits to
  # supporting. Coverage is measured separately (see the `coverage` job) so this matrix stays
  # fast and isn't duplicating the same coverage collection six times.
  test:
    name: test (${{ matrix.os }}, .NET ${{ matrix.dotnet }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: ["8.0", "10.0"]
    runs-on: ${{ matrix.os }}
    env:
      # global.json pins to the 8.0.x SDK band; on the "10.0" leg, override that (rather than
      # mutate global.json in CI) so `dotnet` actually resolves to the installed .NET 10 SDK.
      # Verified locally: DOTNET_ROLL_FORWARD=LatestMajor correctly selects .NET 10 despite the
      # global.json pin, TargetFramework stays net8.0 either way (POR-2: single TFM, tested on
      # both SDKs), and the full test suite passes under it.
      DOTNET_ROLL_FORWARD: ${{ matrix.dotnet == '10.0' && 'LatestMajor' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Directory.Build.props pulls in Nerdbank.GitVersioning for every project build (not
          # just publish), and NBGV needs full history to compute version height - a shallow clone
          # (actions/checkout's default) makes it throw MSB4018/GitException on `dotnet build`.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet build -c Release

      # Target the two projects explicitly rather than `dotnet test -c Release --no-build` at the
      # solution level - that sweeps in DotnetIsolate.E2ETests too, which needs Docker (with a
      # working buildx) and isn't meant to run on every OS/SDK leg here; it has its own dedicated
      # ubuntu-only `e2e` job below.
      - run: dotnet test DotnetIsolate.UnitTests/DotnetIsolate.UnitTests.fsproj -c Release --no-build

      - run: dotnet test DotnetIsolate.IntegrationTests/DotnetIsolate.IntegrationTests.fsproj -c Release --no-build

  # QP-4/QP-5: coverage gates, computed once on a single reference platform rather than per
  # matrix leg. See DESIGN.md ("Why unit coverage needs a different scope than integration
  # coverage") for why the two runs use different coverlet exclude filters.
  coverage:
    name: coverage gates (QP-4, QP-5)
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet build -c Release

      - name: Unit test coverage
        run: >
          dotnet test DotnetIsolate.UnitTests/DotnetIsolate.UnitTests.fsproj -c Release --no-build
          --collect:"XPlat Code Coverage"
          --settings DotnetIsolate.UnitTests/coverage.unit.runsettings
          --results-directory coverage/unit

      - name: Integration test coverage
        run: >
          dotnet test DotnetIsolate.IntegrationTests/DotnetIsolate.IntegrationTests.fsproj -c Release --no-build
          --collect:"XPlat Code Coverage"
          --settings DotnetIsolate.IntegrationTests/coverage.integration.runsettings
          --results-directory coverage/integration

      - name: Check coverage thresholds
        id: check
        run: >
          python3 ${{ github.workspace }}/.github/scripts/check-coverage.py
          "coverage/unit/**/coverage.cobertura.xml" 95
          "coverage/integration/**/coverage.cobertura.xml" 90

  # QP-12: drives real `docker build` runs against both DI-1 patterns, twice back to back with an
  # unrelated file changed in between, asserting the expensive layers cache-hit on the second run
  # under both the classic builder and BuildKit. Excluded from the QP-4/QP-5 coverage *percentage*
  # gates (per QP-12's own text), but still required to pass before publish - it's the only thing
  # that actually exercises the DI-1 Docker patterns end to end. ubuntu-latest runners have Docker
  # preinstalled; builder flavor is toggled per-build (DOCKER_BUILDKIT env var per subprocess), not
  # at the job level, so both run in the same job.
  e2e:
    name: docker e2e (QP-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet build -c Release

      - run: dotnet test DotnetIsolate.E2ETests/DotnetIsolate.E2ETests.fsproj -c Release --no-build

  # QP-7/QP-11: every green commit to main publishes a prerelease package; a tag matching
  # v<major>.<minor> publishes a clean stable release instead. Uses NuGet Trusted Publishing
  # (OIDC token exchange, no stored API key) - policy already configured on nuget.org for
  # repository GuckesThonfeldGuckesGbr/dotnet-isolate, workflow build.yml, environment `main`.
  # `environment: main` below must match that policy exactly, or the OIDC token exchange fails.
  publish:
    name: publish to nuget.org
    needs: [test, coverage, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: main
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning needs full history to compute git height correctly - a shallow
          # clone would produce a wrong (or minimum) height and thus a wrong version number.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack
        run: dotnet pack DotnetIsolate/DotnetIsolate.fsproj -c Release -o ${{ github.workspace }}/artifacts

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
